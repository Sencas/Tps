<!DOCTYPE html>
<html>

  <head>

    <title>Calcolatrice Professionale</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f3f3f3;
      }

      table {
        background-color: #e6e6e6;
        border: 1px solid #999999;
        padding: 5px;
        margin-left: 100px;
        margin-top: 30px;
      }

      #display {
        width: 290px;
        height: 45px;
        font-size: 24px;
        text-align: right;
        padding-right: 10px;
        background-color: #ffffff;
        border: 1px solid #cccccc;
        margin-bottom: 5px;
      }

      input[type="button"] {
        width: 58px;
        height: 42px;
        font-size: 16px;
        background-color: #ffffff;
        border: 1px solid #cccccc;
        cursor: pointer;
      }

      input[type="button"]:hover {
        background-color: #d9d9d9;
      }

      .funzione {
        background-color: #f0f0f0;
      }

      .uguale {
        background-color: #0067c0;
        color: white;
      }

      .uguale:hover {
        background-color: #005a9e;
      }
    </style>

    <script type="text/javascript">

      function aggiungi(valore) {
        document.getElementById("display").value += valore;
      }

      function cancellaTutto() {
        document.getElementById("display").value = "";
      }

      function cancellaUno() {
        var testo = document.getElementById("display").value;
        document.getElementById("display").value = testo.slice(0, -1);
      }

      function calcola() {
        var espressione = document.getElementById("display").value;
        if (espressione != "") {
          document.getElementById("display").value = eval(espressione);
        }
      }

      function funzioneMath(tipo) {
        var val = Number(document.getElementById("display").value);
        var ris = 0;

        if (tipo == "radice") {
          ris = Math.sqrt(val);
        } else if (tipo == "quadrato") {
          ris = Math.pow(val, 2);
        } else if (tipo == "cubo") {
          ris = Math.pow(val, 3);
        } else if (tipo == "inverso") {
          ris = 1 / val;
        } else if (tipo == "seno") {
          ris = Math.sin(val);
        } else if (tipo == "coseno") {
          ris = Math.cos(val);
        } else if (tipo == "tangente") {
          ris = Math.tan(val);
        } else if (tipo == "log") {
          ris = Math.log10(val);
        } else if (tipo == "ln") {
          ris = Math.log(val);
        } else if (tipo == "assoluto") {
          ris = Math.abs(val);
        } else if (tipo == "arrotonda") {
          ris = Math.round(val);
        } else if (tipo == "cambiaSegno") {
          ris = val * -1;
        }

        document.getElementById("display").value = ris;
      }

      function inserisciCostante(costante) {
        if (costante == "PI") {
          document.getElementById("display").value = Math.PI;
        } else if (costante == "E") {
          document.getElementById("display").value = Math.E;
        }
      }

    </script>

  </head>

  <body>

    <table>
      <tr>
        <td colspan="5">
          <input type="text" id="display" readonly>
        </td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="sin" onclick="funzioneMath('seno')"></td>
        <td><input type="button" class="funzione" value="π" onclick="inserisciCostante('PI')"></td>
        <td><input type="button" class="funzione" value="e" onclick="inserisciCostante('E')"></td>
        <td><input type="button" class="funzione" value="C" onclick="cancellaTutto()"></td>
        <td><input type="button" class="funzione" value="⌫" onclick="cancellaUno()"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="cos" onclick="funzioneMath('coseno')"></td>
        <td><input type="button" class="funzione" value="x²" onclick="funzioneMath('quadrato')"></td>
        <td><input type="button" class="funzione" value="1/x" onclick="funzioneMath('inverso')"></td>
        <td><input type="button" class="funzione" value="|x|" onclick="funzioneMath('assoluto')"></td>
        <td><input type="button" class="funzione" value="÷" onclick="aggiungi('/')"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="tan" onclick="funzioneMath('tangente')"></td>
        <td><input type="button" class="funzione" value="√x" onclick="funzioneMath('radice')"></td>
        <td><input type="button" class="funzione" value="7" onclick="aggiungi('7')"></td>
        <td><input type="button" class="funzione" value="8" onclick="aggiungi('8')"></td>
        <td><input type="button" class="funzione" value="9" onclick="aggiungi('9')"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="log" onclick="funzioneMath('log')"></td>
        <td><input type="button" class="funzione" value="x³" onclick="funzioneMath('cubo')"></td>
        <td><input type="button" class="funzione" value="4" onclick="aggiungi('4')"></td>
        <td><input type="button" class="funzione" value="5" onclick="aggiungi('5')"></td>
        <td><input type="button" class="funzione" value="6" onclick="aggiungi('6')"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="ln" onclick="funzioneMath('ln')"></td>
        <td><input type="button" class="funzione" value="≈" onclick="funzioneMath('arrotonda')"></td>
        <td><input type="button" class="funzione" value="1" onclick="aggiungi('1')"></td>
        <td><input type="button" class="funzione" value="2" onclick="aggiungi('2')"></td>
        <td><input type="button" class="funzione" value="3" onclick="aggiungi('3')"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="(" onclick="aggiungi('(')"></td>
        <td><input type="button" class="funzione" value=")" onclick="aggiungi(')')"></td>
        <td><input type="button" class="funzione" value="+/-" onclick="funzioneMath('cambiaSegno')"></td>
        <td><input type="button" value="0" onclick="aggiungi('0')"></td>
        <td><input type="button" value="." onclick="aggiungi('.')"></td>
      </tr>
      <tr>
        <td><input type="button" class="funzione" value="×" onclick="aggiungi('*')"></td>
        <td><input type="button" class="funzione" value="-" onclick="aggiungi('-')"></td>
        <td><input type="button" class="funzione" value="+" onclick="aggiungi('+')"></td>
        <td colspan="2"><input type="button" class="uguale" style="width: 120px;" value="=" onclick="calcola()"></td>
      </tr>
    </table>

  </body>

</html>
