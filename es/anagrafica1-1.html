<!DOCTYPE html>
<html>

 <head>

  <title>Anagrafica1.1</title>

  <script type="text/javascript">

   function calcolaEta() {
        var dataNascitaInput = document.getElementById("dataNascita").value;
        if (dataNascitaInput != "") {
            var oggi = new Date();
            var dataNascita = new Date(dataNascitaInput);
            
            var annoOggi = oggi.getFullYear();
            var annoNascita = dataNascita.getFullYear();
            
            var eta = annoOggi - annoNascita;
            document.getElementById("eta").value = eta;
        }
   }

   function controlla() {

        var nome = document.getElementById("nome").value;
        var cognome = document.getElementById("cognome").value;
        var dataNascita = document.getElementById("dataNascita").value;
        var eta = document.getElementById("eta").value;
        var indirizzo = document.getElementById("indirizzo").value;
        var sesso = "";

        for(i=0; i<document.getElementsByName("sesso").length; i++) {
          if(document.getElementsByName("sesso")[i].checked){
           sesso = document.getElementsByName("sesso")[i].value;
          }
        }

        var materieSelezionate = "";
        var chkMaterie = document.getElementsByName("materie");
        for(i=0; i<chkMaterie.length; i++) {
          if(chkMaterie[i].checked){
            materieSelezionate = materieSelezionate + chkMaterie[i].value + " ";
          }
        }

        var contenitore = document.getElementById("risp");
        contenitore.innerHTML = "";

        var tabella = document.createElement("table");
        tabella.border = "1";

        var etichette = ["Nome", "Cognome", "Data di nascita", "Età", "Indirizzo", "Sesso", "Materie preferite"];
        var valori = [nome, cognome, dataNascita, eta, indirizzo, sesso, materieSelezionate];

        for (var i = 0; i < etichette.length; i++) {
            var riga = document.createElement("tr");

            var cella1 = document.createElement("td");
            cella1.innerHTML = etichette[i];
            riga.appendChild(cella1);

            var cella2 = document.createElement("td");
            cella2.innerHTML = valori[i];
            riga.appendChild(cella2);

            tabella.appendChild(riga);
        }

        contenitore.appendChild(tabella);

    }

    function resetta() {
        document.getElementById("nome").value = "";
        document.getElementById("cognome").value = "";
        document.getElementById("dataNascita").value = "";
        document.getElementById("eta").value = "";
        document.getElementById("indirizzo").value = "";

        for(i=0; i<document.getElementsByName("sesso").length; i++) {
            document.getElementsByName("sesso")[i].checked = false;
        }

        var controllaMaterie = document.getElementsByName("materie");
        for(i=0; i<controllaMaterie.length; i++) {
            chkMaterie[i].checked = false;
        }

        document.getElementById("risp").innerHTML = "";
    }

   </script>

 </head>

 <body>

    <div style="margin-left:100px;">

        <table border="1">
            <tr>
                <td>Nome:</td>
                <td><input type="text" id="nome"></td>
            </tr>
            <tr>
                <td>Cognome:</td>
                <td><input type="text" id="cognome"></td>
            </tr>
            <tr>
                <td>Data di nascita:</td>
                <td><input type="date" id="dataNascita" onchange="calcolaEta();"></td>
            </tr>
            <tr>
                <td>Età:</td>
                <td><input type="text" id="eta" readonly></td>
            </tr>
            <tr>
                <td>Indirizzo:</td>
                <td><input type="text" id="indirizzo"></td>
            </tr>
            <tr>
                <td>Sesso:</td>
                <td>
                    <input type="radio" name="sesso" value="Maschio">Maschio<br>
                    <input type="radio" name="sesso" value="Femmina">Femmina
                </td>
            </tr>
            <tr>
                <td>Materie preferite:</td>
                <td>
                    <input type="checkbox" name="materie" value="Informatica">Informatica<br>
                    <input type="checkbox" name="materie" value="Matematica">Matematica<br>
                    <input type="checkbox" name="materie" value="Sistemi">Sistemi<br>
                    <input type="checkbox" name="materie" value="TPSIT">TPSIT
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" onclick="controlla();" value="Invia">
                    <input type="button" onclick="resetta();" value="Nuovo Inserimento">
                </td>
            </tr>
        </table>

    </div>

    <br>
    <div id="risp" style="margin-left:100px;"></div>

  </body>

 </html>
