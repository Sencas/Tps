<!DOCTYPE html>
<html>

 <head>

  <title>Anagrafica1.1</title>

  <script type="text/javascript">

   function calcolaEta() {
        var dataNascita = document.getElementById("dataNascita").value;
        if (dataNascita != "") {
            var eta = 2026 - dataNascita;
            document.getElementById("eta").value = eta;
        }
   }

   function controlla() {

        var nome = document.getElementById("nome").value;
        var cognome = document.getElementById("cognome").value;
        var dataNascita = document.getElementById("dataNascita").value;
        var eta = document.getElementById("eta").value;
        var indirizzo = document.getElementById("indirizzo").value;
        var sesso = "";

        for(i=0; i<document.getElementsByName("sesso").length; i++) {
          if(document.getElementsByName("sesso")[i].checked){
           sesso = document.getElementsByName("sesso")[i].value;
          }
        }

        var materieSelezionate = "";
        var controllaMaterie = document.getElementsByName("materie");
        for(i=0; i<controllaMaterie.length; i++) {
          if(controllaMaterie[i].checked){
            materieSelezionate = materieSelezionate + controllaMaterie[i].value + " ";
          }
        }

        var contenitore = document.getElementById("risp");
        contenitore.innerHTML = "";

        var tabella = document.createElement("table");
        tabella.border = "1";

        var etichette = ["Nome", "Cognome", "Data di nascita", "Età", "Indirizzo", "Sesso", "Materie preferite"];
        var valori = [nome, cognome, dataNascita, eta, indirizzo, sesso, materieSelezionate];

        for (var i = 0; i < etichette.length; i++) {
            var riga = document.createElement("tr");

            var cella1 = document.createElement("td");
            cella1.innerHTML = etichette[i];
            riga.appendChild(cella1);

            var cella2 = document.createElement("td");
            cella2.innerHTML = valori[i];
            riga.appendChild(cella2);

            tabella.appendChild(riga);
        }

        contenitore.appendChild(tabella);

    }

    function resetta() {
        document.getElementById("nome").value = "";
        document.getElementById("cognome").value = "";
        document.getElementById("dataNascita").value = "";
        document.getElementById("eta").value = "";
        document.getElementById("indirizzo").value = "";

        for(i=0; i<document.getElementsByName("sesso").length; i++) {
            document.getElementsByName("sesso")[i].checked = false;
        }

        var controllaMaterie = document.getElementsByName("materie");
        for(i=0; i<controllaMaterie.length; i++) {
            controllaMaterie[i].checked = false;
        }

        document.getElementById("risp").innerHTML = "";
    }

   </script>

 </head>

 <body>

                <td>Nome:</td>
                <td><input type="text" id="nome"></td>
            </tr>
            <tr>
                <td>Cognome:</td>
                <td><input type="text" id="cognome"></td>
            </tr>
