<!DOCTYPE html>
<html>

  <head>

    <title>Calcolatrice</title>

    <script type="text/javascript">

      function aggiungi(valore) {
        document.getElementById("display").value += valore;
      }

      function cancellaTutto() {
        document.getElementById("display").value = "";
      }

      function calcola() {
        var espressione = document.getElementById("display").value;
        if (espressione != "") {
          document.getElementById("display").value = eval(espressione);
        }
      }

      function funzioneMath(tipo) {
        var val = Number(document.getElementById("display").value);
        var ris = 0;

        if (tipo == "radice") {
          ris = Math.sqrt(val);
        } else if (tipo == "quadrato") {
          ris = Math.pow(val, 2);
        } else if (tipo == "reciproco") {
          ris = 1 / val;
        }

        document.getElementById("display").value = ris;
      }

    </script>

  </head>

  <body>

    <div style="margin-left:100px; margin-top:30px;">

      <table>
        <tr>
          <td colspan="4">
            <input type="text" id="display" style="width:210px; height:35px; font-size:20px; text-align:right;" readonly>
          </td>
        </tr>
        <tr>
          <td><input type="button" style="width:50px; height:35px;" value="1/x" onclick="funzioneMath('reciproco')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="x²" onclick="funzioneMath('quadrato')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="√x" onclick="funzioneMath('radice')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="÷" onclick="aggiungi('/')"></td>
        </tr>
        <tr>
          <td><input type="button" style="width:50px; height:35px;" value="7" onclick="aggiungi('7')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="8" onclick="aggiungi('8')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="9" onclick="aggiungi('9')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="×" onclick="aggiungi('*')"></td>
        </tr>
        <tr>
          <td><input type="button" style="width:50px; height:35px;" value="4" onclick="aggiungi('4')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="5" onclick="aggiungi('5')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="6" onclick="aggiungi('6')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="-" onclick="aggiungi('-')"></td>
        </tr>
        <tr>
          <td><input type="button" style="width:50px; height:35px;" value="1" onclick="aggiungi('1')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="2" onclick="aggiungi('2')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="3" onclick="aggiungi('3')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="+" onclick="aggiungi('+')"></td>
        </tr>
        <tr>
          <td><input type="button" style="width:50px; height:35px;" value="C" onclick="cancellaTutto()"></td>
          <td><input type="button" style="width:50px; height:35px;" value="0" onclick="aggiungi('0')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="." onclick="aggiungi('.')"></td>
          <td><input type="button" style="width:50px; height:35px;" value="=" onclick="calcola()"></td>
        </tr>
      </table>

    </div>

  </body>

</html>
